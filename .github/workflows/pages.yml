name: Sito GitHub Pages

# Pubblica il sito (cartella docs/) e la versione del gioco giocabile nel
# browser, che finisce in /gioca/ e si aggiorna a ogni push su main.

on:
  push:
    branches: [main]
  pull_request:
    paths: ['docs/**', 'web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Player web di mkxp-z (lo stesso motore di Game.exe, compilato per browser).
  PLAYER_REPO: white-axe/mkxp-z-libretro-emscripten
  PLAYER_REF: 0b0a95277171dfdb2a261c8e50888bf48691ad6e
  CORE_URL: https://white-axe.github.io/mkxp-z-libretro-emscripten/nostalgist-knight-blade-howling-of-kerberos

jobs:
  # Impacchetta il gioco e costruisce la pagina /gioca/.
  # Se questo job fallisce il sito viene pubblicato lo stesso, senza il gioco.
  gioco:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il gioco
        uses: actions/checkout@v4
        with:
          path: gioco

      - name: Scarica il player web
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLAYER_REPO }}
          ref: ${{ env.PLAYER_REF }}
          path: player

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Impacchetta i file del gioco
        run: |
          pip3 install rpzip
          cd gioco
          # mkxp.json per il browser: niente commenti/virgole finali e titolo
          # senza accenti (con "é" il motore web si blocca all'avvio).
          python3 - <<'PY'
          import json, re
          s = open("mkxp.json", encoding="utf-8").read()
          s = re.sub(r'(?m)^\s*//.*$', '', s)
          s = re.sub(r',(\s*[}\]])', r'\1', s)
          conf = json.loads(s)
          conf["windowTitle"] = "Pokemon Muia"
          json.dump(conf, open("mkxp.json", "w", encoding="utf-8"), indent=2)
          print(open("mkxp.json").read())
          PY
          rpzip -r ../player/nostalgist/public/pokemon-muia.mkxpz \
            Game.ini mkxp.json soundfont.sf2 \
            Data Graphics Audio Fonts Plugins Movies
          ls -lh ../player/nostalgist/public/pokemon-muia.mkxpz

      - name: Scarica il motore
        run: |
          cd player/nostalgist/public
          curl -fL --retry 3 -o mkxp-z_libretro.js "$CORE_URL/mkxp-z_libretro.js"
          curl -fL --retry 3 -o mkxp-z_libretro.wasm "$CORE_URL/mkxp-z_libretro.wasm"
          ls -lh

      - name: Costruisce la pagina
        run: |
          cd player/nostalgist
          {
            echo "VITE_CORE_JS_PATH=./mkxp-z_libretro.js"
            echo "VITE_CORE_WASM_PATH=./mkxp-z_libretro.wasm"
            echo "VITE_GAME_NAME=Pokémon Muia"
            echo "VITE_GAME_PATH=./pokemon-muia.mkxpz"
          } >> .env
          # Pagina e script nostri (web/gioca): caricamento in memoria,
          # schermata di avvio, tasti touch e invito a girare il telefono.
          cp ../../gioco/web/gioca/index.html index.html
          cp ../../gioco/web/gioca/main.ts src/main.ts
          npm install
          node update-env.ts
          npx vite build
          cp node_modules/coi-serviceworker/coi-serviceworker.min.js dist/

      - uses: actions/upload-artifact@v4
        with:
          name: gioca
          path: player/nostalgist/dist
          retention-days: 3

  build:
    needs: gioco
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs
          sparse-checkout-cone-mode: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs
      - run: bundle exec jekyll build --destination _site
        env:
          JEKYLL_ENV: production
      - name: Aggiunge il gioco in /gioca/
        if: needs.gioco.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: gioca
          path: docs/_site/gioca
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
