{% assign en = false %}{% if page.lang == 'en' %}{% assign en = true %}{% endif %}

    <figcaption>{% if en %}The Muia crest from the splash screen{% else %}Lo stemma di Muia dalla schermata iniziale{% endif %}</figcaption>
  </figure>
  <figure><img class="pixel" src="{{ '/images/introPolidori.png' | relative_url }}" alt="Polidori" width="69" height="172" loading="lazy" /><figcaption>Polidori</figcaption></figure>
  <figure><img class="pixel" src="{{ '/images/ritratto_CINGHIO.png' | relative_url }}" alt="Cinghio" width="94" height="200" loading="lazy" /><figcaption>Cinghio</figcaption></figure>
  <figure><img class="pixel" src="{{ '/images/ritratto_SANDRA_OMO.png' | relative_url }}" alt="Sandra Omo" width="79" height="200" loading="lazy" /><figcaption>Sandra Omo</figcaption></figure>
  <figure><img class="pixel" src="{{ '/images/ritratto_HENRY.png' | relative_url }}" alt="Henry" width="85" height="200" loading="lazy" /><figcaption>Henry</figcaption></figure>
</div>
