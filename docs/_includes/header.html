<div class='header'>
  <div class="container">
    {% assign t = site.data.i18n[page.lang] %}
    <div class="logo site-title"><a href="{{ t.home | relative_url }}">{{ site.title }}</a></div>
    <div class="logo-mobile site-title"><a href="{{ t.home | relative_url }}">{{ site.title }}</a></div>
    {% include main-menu.html %}
    <button type="button" id="theme-toggle" class="theme-toggle" data-secret="{{ t.secret | relative_url }}" aria-label="{{ t.theme_aria }}" title="{{ t.theme_title }}"><span aria-hidden="true" class="theme-icon"></span></button>
    {% include hamburger.html %}
  </div>
</div>
