<div class="sub-footer">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="sub-footer-inner">
          {% if site.data.social %}
            {% include social.html %}
          {% endif %}
          {% assign cr = site.data.seo.copyright_text %}{% if page.lang == 'en' %}{% assign cr = site.data.seo.copyright_text_en %}{% endif %}{% if cr %}
          <div class="copyright">{{ cr }}</div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>
