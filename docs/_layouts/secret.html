<!DOCTYPE html>
<html lang="{{ page.lang }}">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon-32x32.svg' | relative_url }}">
  <style>
    :root { --bg:#0b0f0c; --fg:#b8f5c4; --dim:#6fae7d; --acc:#ffd24a; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 ui-monospace,"Cascadia Mono",Consolas,monospace; }
    main { max-width: 760px; margin: 0 auto; padding: 2rem 16px 4rem; }
    h1 { color: var(--acc); font-size: 1.4rem; margin: 0 0 .25rem; }
    h2 { color: var(--acc); font-size: 1.05rem; margin: 2rem 0 .5rem; }
    h2::before { content: "$ "; color: var(--dim); }
    p, li { margin: .3rem 0; }
    ul { padding-left: 1.2rem; }
    a { color: var(--acc); }
    code { background:#142018; padding:0 .3em; }
    .dim { color: var(--dim); }
    .back { display:inline-block; margin-top:2rem; }
    img { image-rendering: pixelated; max-width: 100%; }
    .cursor::after { content:"_"; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor::after { animation: none; } }
  </style>
</head>
<body>
<main>
  <p class="dim">pokemon-muia://{{ page.slug }}</p>
  <h1 class="cursor">{{ page.title }}</h1>
  {{ content }}
  <a class="back" href="{{ page.back | relative_url }}">← {{ page.back_label }}</a>
</main>
</body>
</html>
