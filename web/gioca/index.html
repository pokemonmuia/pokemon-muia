<!doctype html>
<html lang="it" style="height: 100%">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="Pokémon Muia" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Pokémon Muia</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        overscroll-behavior: none;
      }
      .center {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 18px;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      #loading {
        z-index: 2;
        pointer-events: none;
      }
      #bar {
        display: none;
        position: fixed;
        left: 50%;
        bottom: 14%;
        transform: translateX(-50%);
        width: min(360px, 70vw);
        z-index: 3;
        pointer-events: none;
        text-align: center;
      }
      #bar-track {
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      #bar-fill {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: #e3350d;
        transition: width 0.2s linear;
      }
      #bar-label {
        margin-top: 10px;
        font-size: 14px;
        opacity: 0.85;
        font-variant-numeric: tabular-nums;
      }
      #status.error {
        color: #ff8a73;
        padding: 0 20px;
      }
      #status {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12%;
        text-align: center;
        font-size: 15px;
        opacity: 0.85;
        z-index: 3;
        pointer-events: none;
      }
      #start-button {
        display: none;
        z-index: 4;
        background: transparent;
        border: 0;
        color: #fff;
        cursor: pointer;
        font: inherit;
      }
      #start-button .title {
        font-size: clamp(26px, 6vw, 44px);
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      #start-button .play {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #e3350d;
        border-radius: 999px;
        padding: 14px 32px;
        font-size: 20px;
        font-weight: 700;
        box-shadow: 0 6px 0 #9c2408;
      }
      #start-button .play:active {
        transform: translateY(3px);
        box-shadow: 0 3px 0 #9c2408;
      }
      #start-button .hint {
        font-size: 13px;
        opacity: 0.7;
        max-width: 420px;
        line-height: 1.5;
      }
      /* Copia dei salvataggi (solo nella schermata "Gioca") */
      #save-tools {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: max(14px, env(safe-area-inset-bottom));
        z-index: 5;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        font-size: 13px;
        text-align: center;
      }
      #save-tools .row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      #save-tools button {
        font: inherit;
        color: #fff;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 999px;
        padding: 8px 16px;
        cursor: pointer;
      }
      #save-tools button:active {
        background: rgba(255, 255, 255, 0.25);
      }
      #save-tools button:disabled {
        opacity: 0.5;
      }
      #save-tools .note {
        max-width: 460px;
        line-height: 1.45;
        opacity: 0.6;
      }
      #save-msg {
        min-height: 1.4em;
        opacity: 0.95;
      }
      #save-msg.error {
        color: #ff8a73;
      }
      body:not(.touch) .only-touch,
      body.touch .only-desktop {
        display: none;
      }

      /* Invito a girare il telefono */
      #rotate {
        display: none;
        z-index: 10;
        background: #000;
      }
      #rotate .phone {
        width: 44px;
        height: 76px;
        border: 4px solid #fff;
        border-radius: 10px;
        animation: turn 2s ease-in-out infinite;
      }
      @keyframes turn {
        0%,
        20% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(-90deg);
        }
      }
      @media (orientation: portrait) {
        body.touch #rotate {
          display: flex;
        }
      }

      /* Tasti a schermo */
      #controls {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }
      #controls > * {
        pointer-events: auto;
        touch-action: none;
      }
      #dpad {
        position: absolute;
        left: calc(18px + env(safe-area-inset-left));
        bottom: 18px;
        width: min(150px, 34vh);
        height: min(150px, 34vh);
      }
      #dpad .arm {
        position: absolute;
        background: rgba(255, 255, 255, 0.18);
        border: 2px solid rgba(255, 255, 255, 0.35);
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.7);
      }
      #dpad .arm.pressed {
        background: rgba(255, 255, 255, 0.45);
      }
      #dpad [data-dir="up"] {
        left: 33.3%;
        top: 0;
        width: 33.4%;
        height: 36%;
        border-radius: 8px 8px 0 0;
        border-bottom: 0;
      }
      #dpad [data-dir="down"] {
        left: 33.3%;
        bottom: 0;
        width: 33.4%;
        height: 36%;
        border-radius: 0 0 8px 8px;
        border-top: 0;
      }
      #dpad [data-dir="left"] {
        top: 33.3%;
        left: 0;
        height: 33.4%;
        width: 36%;
        border-radius: 8px 0 0 8px;
        border-right: 0;
      }
      #dpad [data-dir="right"] {
        top: 33.3%;
        right: 0;
        height: 33.4%;
        width: 36%;
        border-radius: 0 8px 8px 0;
        border-left: 0;
      }
      #dpad .hub {
        position: absolute;
        left: 33.3%;
        top: 33.3%;
        width: 33.4%;
        height: 33.4%;
        background: rgba(255, 255, 255, 0.18);
      }
      .round {
        position: absolute;
        width: min(64px, 15vh);
        height: min(64px, 15vh);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        border: 2px solid rgba(255, 255, 255, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.85);
        box-sizing: border-box;
      }
      .round.pressed,
      .pill.pressed {
        background: rgba(255, 255, 255, 0.5);
      }
      #btn-a {
        right: calc(18px + env(safe-area-inset-right));
        bottom: calc(18px + min(64px, 15vh) * 0.7);
      }
      #btn-b {
        right: calc(18px + env(safe-area-inset-right) + min(64px, 15vh) * 1.15);
        bottom: 12px;
      }
      .pill {
        position: absolute;
        top: calc(12px + env(safe-area-inset-top));
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        border: 2px solid rgba(255, 255, 255, 0.35);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: rgba(255, 255, 255, 0.8);
      }
      #btn-select {
        left: calc(18px + env(safe-area-inset-left));
      }
      #btn-start {
        right: calc(18px + env(safe-area-inset-right));
      }
    </style>
  </head>
  <body>
    <script>
      // Programma in background (sw.js): dà al motore le intestazioni COOP/COEP
      // che gli servono e tiene una copia della pagina per l'uso senza rete.
      (() => {
        const n = navigator;
        if (!n.serviceWorker || !window.isSecureContext) {
          return;
        }
        if (n.serviceWorker.controller) {
          n.serviceWorker.controller.postMessage({
            type: "coepCredentialless",
            value: !(window.chrome || window.netscape),
          });
        }
        n.serviceWorker.register("./sw.js").then(
          async (registration) => {
            // Alla prima apertura la pagina non è ancora "isolata": serve
            // ricaricarla una volta, ma solo quando il programma è attivo
            // (se si ricarica prima, la pagina arriva ancora senza di lui).
            if (window.crossOriginIsolated !== false) {
              return;
            }
            let ricariche = 0;
            try {
              ricariche = Number(sessionStorage.getItem("muia-sw-ricariche") || 0);
            } catch (err) {
              // sessionStorage non disponibile: si va avanti senza contare
            }
            if (ricariche >= 3) {
              return; // non girare all'infinito se qualcosa non va
            }
            const sw = registration.installing || registration.waiting || registration.active;
            if (sw && sw.state !== "activated") {
              const attivo = await new Promise((resolve) => {
                sw.addEventListener("statechange", () => {
                  if (sw.state === "activated") {
                    resolve(true);
                  } else if (sw.state === "redundant") {
                    resolve(false);
                  }
                });
              });
              if (!attivo) {
                return;
              }
            }
            try {
              sessionStorage.setItem("muia-sw-ricariche", String(ricariche + 1));
            } catch (err) {
              // vedi sopra
            }
            location.reload();
          },
          (err) => console.error("sw.js non registrato:", err),
        );
      })();
    </script>
    <script>
      // Tiene sveglio sw.js mentre scarica file grandi (Firefox)
      if (navigator.serviceWorker && navigator.serviceWorker.controller !== null) {
        setInterval(() => {
          navigator.serviceWorker.controller.postMessage({ type: "heartbeat" });
        }, 5000);
      }
    </script>

    <canvas
      id="nostalgist-canvas"
      style="position: fixed; left: 0; top: 0; width: 100%; height: 100%"
    ></canvas>

    <div id="bar">
      <div id="bar-track"><div id="bar-fill"></div></div>
      <div id="bar-label">Preparazione…</div>
    </div>
    <div id="status" style="display: none"></div>

    <button id="start-button" class="center" type="button">
      <span class="title">Pokémon Muia</span>
      <span class="play">▶ Gioca</span>
      <span class="hint only-desktop">
        Frecce per muoverti · Z o Spazio = A · X = B · Esc menu · D menu rapido
      </span>
      <span class="hint only-touch">Gioca col telefono in orizzontale</span>
    </button>

    <div id="save-tools">
      <div id="save-msg" role="status"></div>
      <div class="row">
        <button id="save-export" type="button">Salva una copia dei salvataggi</button>
        <button id="save-import" type="button">Carica una copia</button>
      </div>
      <div class="note">
        I salvataggi resta in sto browser. Fa una copia ogni tanto: te serve se
        te cancelli i dati del sito o se te cambi telefono o computer.
      </div>
      <input id="save-file" type="file" accept=".json,application/json" hidden />
    </div>

    <div id="rotate" class="center">
      <div class="phone"></div>
      <div>Gira il telefono in orizzontale per giocare</div>
    </div>

    <div id="controls">
      <div id="dpad">
        <div class="arm" data-dir="up">▲</div>
        <div class="arm" data-dir="left">◀</div>
        <div class="hub"></div>
        <div class="arm" data-dir="right">▶</div>
        <div class="arm" data-dir="down">▼</div>
      </div>
      <div id="btn-b" class="round" data-button="b">B</div>
      <div id="btn-a" class="round" data-button="a">A</div>
      <div id="btn-select" class="pill" data-button="r3">SELECT</div>
      <div id="btn-start" class="pill" data-button="x">START</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
