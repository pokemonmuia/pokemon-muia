<html lang="it" style="height: 100%">

    <title>Pokémon Muia</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        overscroll-behavior: none;
      }
      .center {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 18px;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      #loading {
        z-index: 2;
        pointer-events: none;
      }
      /* Schermata d'avvio animada (el Delfin Verde che riva a Muia) */
      #splash {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        transition: opacity 0.8s ease;
        background: #0b1f3a;
      }
      #splash.via {
        opacity: 0;
        pointer-events: none;
      }
      /* Sfondo animado de Muia vista dal'alto: matina che deventa note col caricamento */
      #sfondi {
        position: fixed;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        pointer-events: none;
        transition: opacity 0.8s ease;
      }
      #sfondi.via {
        opacity: 0;
      }
      #splash-caption {
        position: fixed;
        left: 0;
        right: 0;
        top: max(14px, env(safe-area-inset-top));
        z-index: 2;
        text-align: center;
        font-size: clamp(12px, 2.6vw, 15px);
        letter-spacing: 0.04em;
        color: #fff;
        text-shadow: 0 2px 0 #000, 0 0 8px rgba(0, 0, 0, 0.6);
        pointer-events: none;
        transition: opacity 0.8s ease;
      }
      #splash-caption.via {
        opacity: 0;
      }
      #bar {
        display: none;
        position: fixed;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        width: min(420px, 78vw);
        z-index: 3;
        pointer-events: none;
        text-align: center;
      }
      #bar-track {
        position: relative;
        height: 16px;
        border-radius: 4px;
        background: #102540;
        border: 3px solid #fff;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.45);
        overflow: visible;
      }
      #bar-fill {
        height: 100%;
        width: 0;
        border-radius: 1px;
        background: repeating-linear-gradient(-45deg, #e3350d 0 10px, #ff6a3d 10px 20px);
        background-size: 28px 28px;
        animation: righe 0.8s linear infinite;
        transition: width 0.2s linear;
      }

        to {
          background-position: 28px 0;
        }

      #bar-label {
        margin-top: 12px;
        font-size: 14px;
        font-weight: 700;
        text-shadow: 0 2px 0 #000;
        font-variant-numeric: tabular-nums;
      }
      #status.error {
        color: #ff8a73;
        padding: 0 20px;
      }
      #status {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12%;
        text-align: center;
        font-size: 15px;
        opacity: 0.85;
        z-index: 3;
        pointer-events: none;
      }
      #start-button {
        display: none;
        z-index: 4;
        background: transparent;
        border: 0;
        color: #fff;
        cursor: pointer;
        font: inherit;
      }
      #start-button .title {
        font-size: clamp(30px, 7vw, 54px);
        font-weight: 900;
        letter-spacing: 0.03em;
        color: #ffcb05;
        -webkit-text-stroke: 2px #2a5ba8;
        text-shadow: 0 4px 0 #2a5ba8, 0 8px 0 rgba(0, 0, 0, 0.35);
        animation: galleggia 2.4s ease-in-out infinite;
      }
      #start-button .sub {
        margin-top: -10px;
        font-size: clamp(12px, 2.4vw, 15px);
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-shadow: 0 2px 0 #000;
        opacity: 0.9;
      }
      @keyframes galleggia {
        50% {
          transform: translateY(-6px);
        }
      }
      #start-button .play {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        background: linear-gradient(#ff5a33, #e3350d 55%, #c22a08);
        border: 3px solid #fff;
        border-radius: 999px;
        padding: 14px 36px 14px 18px;
        font-size: 21px;
        font-weight: 800;
        letter-spacing: 0.03em;
        box-shadow: 0 6px 0 #7d1c05, 0 10px 18px rgba(0, 0, 0, 0.4);
        animation: pulsa 1.6s ease-in-out infinite;
      }
      #start-button .play .ball {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 3px solid #222;
        background: linear-gradient(#e3350d 0 45%, #222 45% 55%, #fff 55%);
        box-sizing: border-box;
        position: relative;
      }
      #start-button .play .ball::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 8px;
        height: 8px;
        margin: -4px 0 0 -4px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid #222;
        box-sizing: border-box;
      }
      #start-button:hover .play .ball,
      #start-button:focus .play .ball {
        animation: dondola 0.5s ease-in-out infinite;
      }
      @keyframes dondola {
        25% {
          transform: rotate(-18deg);
        }
        75% {
          transform: rotate(18deg);
        }
      }
      @keyframes pulsa {
        50% {
          transform: scale(1.04);
        }
      }
      #start-button .play:active {
        transform: translateY(3px);
        box-shadow: 0 3px 0 #7d1c05;
        animation: none;
      }
      #start-button .hint {
        font-size: 13px;
        opacity: 0.85;
        text-shadow: 0 1px 0 #000;
        background: rgba(0, 0, 0, 0.35);
        padding: 6px 12px;
        border-radius: 8px;
        max-width: 420px;
        line-height: 1.5;
      }
      /* Copia dei salvataggi (solo nella schermata "Gioca") */
      #save-tools {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: max(14px, env(safe-area-inset-bottom));
        z-index: 5;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        font-size: 13px;
        text-align: center;
      }
      #save-tools .row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      #save-tools button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: rgba(10, 30, 60, 0.75);
        border: 2px solid rgba(255, 255, 255, 0.6);
        border-radius: 999px;
        padding: 8px 16px;
        cursor: pointer;
      }
      #save-tools button:active {
        background: rgba(255, 255, 255, 0.25);
      }
      #save-tools button:disabled {
        opacity: 0.5;
      }
      #save-tools .note {
        max-width: 460px;
        line-height: 1.45;
        opacity: 0.8;
        text-shadow: 0 1px 0 #000;
      }
      #save-msg {
        min-height: 1.4em;
        opacity: 0.95;
      }
      #save-msg.error {
        color: #ff8a73;
      }
      body:not(.touch) .only-touch,
      body.touch .only-desktop {
        display: none;
      }

      /* Invito a girare il telefono */
      #rotate {
        display: none;
        z-index: 10;
        background: #000;
      }
      #rotate .phone {
        width: 44px;
        height: 76px;
        border: 4px solid #fff;
        border-radius: 10px;
        animation: turn 2s ease-in-out infinite;
      }
      @keyframes turn {
        0%,
        20% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(-90deg);
        }
      }
      /* In verticale (telefono): el zogo in alto, i tasti soto, come un Game Boy */
      @media (orientation: portrait) {
        /* el canvas resta grando quanto la finestra (RetroArch el centra el
           zogo), lo spostemo in su con lo script "verticale" più in basso */
        body.touch #controls {
          top: var(--alto-zogo, 75vw);
        }
        body.touch #dpad {
          left: 7vw;
          bottom: auto;
          top: 50%;
          transform: translateY(-50%);
          width: min(44vw, 190px);
          height: min(44vw, 190px);
        }
        body.touch .round {
          width: min(19vw, 84px);
          height: min(19vw, 84px);
          font-size: 26px;
        }
        body.touch #btn-a {
          right: 6vw;
          bottom: auto;
          top: calc(50% - min(19vw, 84px) * 0.95);
        }
        body.touch #btn-b {
          right: calc(6vw + min(19vw, 84px) * 1.15);
          bottom: auto;
          top: calc(50% - min(19vw, 84px) * 0.1);
        }
        body.touch .pill {
          top: auto;
          bottom: calc(22px + env(safe-area-inset-bottom));
          font-size: 13px;
          padding: 8px 18px;
        }
        body.touch #btn-select {
          left: calc(50% - 112px);
        }
        body.touch #btn-start {
          right: calc(50% - 112px);
        }
      }

      /* Tasti a schermo */
      #controls {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }
      #controls > * {
        pointer-events: auto;
        touch-action: none;
      }
      #dpad {
        position: absolute;
        left: calc(18px + env(safe-area-inset-left));
        bottom: 18px;
        width: min(150px, 34vh);
        height: min(150px, 34vh);
      }
      #dpad .arm {
        position: absolute;
        background: rgba(255, 255, 255, 0.18);
        border: 2px solid rgba(255, 255, 255, 0.35);
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.7);
      }
      #dpad .arm.pressed {
        background: rgba(255, 255, 255, 0.45);
      }
      #dpad [data-dir="up"] {
        left: 33.3%;
        top: 0;
        width: 33.4%;
        height: 36%;
        border-radius: 8px 8px 0 0;
        border-bottom: 0;
      }
      #dpad [data-dir="down"] {
        left: 33.3%;
        bottom: 0;
        width: 33.4%;
        height: 36%;
        border-radius: 0 0 8px 8px;
        border-top: 0;
      }
      #dpad [data-dir="left"] {
        top: 33.3%;
        left: 0;
        height: 33.4%;
        width: 36%;
        border-radius: 8px 0 0 8px;
        border-right: 0;
      }
      #dpad [data-dir="right"] {
        top: 33.3%;
        right: 0;
        height: 33.4%;
        width: 36%;
        border-radius: 0 8px 8px 0;
        border-left: 0;
      }
      #dpad .hub {
        position: absolute;
        left: 33.3%;
        top: 33.3%;
        width: 33.4%;
        height: 33.4%;
        background: rgba(255, 255, 255, 0.18);
      }
      .round {
        position: absolute;
        width: min(64px, 15vh);
        height: min(64px, 15vh);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        border: 2px solid rgba(255, 255, 255, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.85);
        box-sizing: border-box;
      }
      .round.pressed,
      .pill.pressed {
        background: rgba(255, 255, 255, 0.5);
      }
      #btn-a {
        right: calc(18px + env(safe-area-inset-right));
        bottom: calc(18px + min(64px, 15vh) * 0.7);
      }
      #btn-b {
        right: calc(18px + env(safe-area-inset-right) + min(64px, 15vh) * 1.15);
        bottom: 12px;
      }
      .pill {
        position: absolute;
        top: calc(12px + env(safe-area-inset-top));
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        border: 2px solid rgba(255, 255, 255, 0.35);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: rgba(255, 255, 255, 0.8);
      }
      #btn-select {
        left: calc(18px + env(safe-area-inset-left));
      }
      #btn-start {
        right: calc(18px + env(safe-area-inset-right));
      }
    </style>
  </head>

    <script>
      // Programma in background (sw.js): dà al motore le intestazioni COOP/COEP
      // che gli servono e tiene una copia della pagina per l'uso senza rete.
      (() => {
        const n = navigator;
        if (!n.serviceWorker || !window.isSecureContext) {
          return;
        }
        if (n.serviceWorker.controller) {
          n.serviceWorker.controller.postMessage({
            type: "coepCredentialless",
            value: !(window.chrome || window.netscape),
          });
        }
        n.serviceWorker.register("./sw.js").then(
          async (registration) => {
            // Alla prima apertura la pagina non è ancora "isolata": serve
            // ricaricarla una volta, ma solo quando il programma è attivo
            // (se si ricarica prima, la pagina arriva ancora senza di lui).
            if (window.crossOriginIsolated !== false) {
              return;
            }
            let ricariche = 0;
            try {
              ricariche = Number(sessionStorage.getItem("muia-sw-ricariche") || 0);
            } catch (err) {
              // sessionStorage non disponibile: si va avanti senza contare
            }
            if (ricariche >= 3) {
              return; // non girare all'infinito se qualcosa non va
            }
            const sw = registration.installing || registration.waiting || registration.active;
            if (sw && sw.state !== "activated") {
              const attivo = await new Promise((resolve) => {
                sw.addEventListener("statechange", () => {
                  if (sw.state === "activated") {
                    resolve(true);
                  } else if (sw.state === "redundant") {
                    resolve(false);
                  }
                });
              });
              if (!attivo) {
                return;
              }
            }
            try {
              sessionStorage.setItem("muia-sw-ricariche", String(ricariche + 1));
            } catch (err) {
              // vedi sopra
            }
            location.reload();
          },
          (err) => console.error("sw.js non registrato:", err),
        );
      })();
    </script>
    <script>
      // Tiene sveglio sw.js mentre scarica file grandi (Firefox)
      if (navigator.serviceWorker && navigator.serviceWorker.controller !== null) {
        setInterval(() => {
          navigator.serviceWorker.controller.postMessage({ type: "heartbeat" });
        }, 5000);
      }
    </script>

    <canvas
      id="nostalgist-canvas"
      style="position: fixed; left: 0; top: 0; width: 100%; height: 100%"
    ></canvas>

    <canvas id="splash" width="320" height="180"></canvas>
    <div id="sfondi"></div>
    <div id="splash-caption">El Delfin Verde porta un foresto a Muia…</div>

    <div id="bar">
      <div id="bar-track"><div id="bar-fill"></div><div id="bar-icon"></div></div>
      <div id="bar-label">Preparazione…</div>
    </div>
    <div id="status" style="display: none"></div>

    <button id="start-button" class="center" type="button">
      <span class="title">Pokémon Muia</span>
      <span class="sub">El Foresto</span>
      <span class="play"><span class="ball"></span>Gioca</span>
      <span class="hint only-desktop">
        Frecce per muoverti · Z o Spazio = A · X = B · Esc menu · D menu rapido · I tasti si cambiano in "Conza el zogo" → Tasti
      </span>
      <span class="hint only-touch">Gioca col telefono in orizzontale</span>
    </button>

      <div id="save-msg" role="status"></div>
      <div class="row">
        <button id="save-export" type="button">Salva una copia dei salvataggi</button>
        <button id="save-import" type="button">Carica una copia</button>
      </div>
      <div class="note">
        I salvataggi resta in sto browser. Fa una copia ogni tanto: te serve se
        te cancelli i dati del sito o se te cambi telefono o computer.
      </div>
      <input id="save-file" type="file" accept=".json,application/json" hidden />
    </div>

    <div id="controls">
      <div id="dpad">
        <div class="arm" data-dir="up">▲</div>
        <div class="arm" data-dir="left">◀</div>
        <div class="hub"></div>
        <div class="arm" data-dir="right">▶</div>
        <div class="arm" data-dir="down">▼</div>
      </div>
      <div id="btn-b" class="round" data-button="b">B</div>
      <div id="btn-a" class="round" data-button="a">A</div>
      <div id="btn-select" class="pill" data-button="r3">SELECT</div>
      <div id="btn-start" class="pill" data-button="x">START</div>
    </div>

    <script>
      // Verticale sul telefono: el zogo (4:3) va in cima, i tasti soto su nero.
      // El canvas resta grando come la finestra perché RetroArch el calcola la
      // posizion del zogo sula finestra intiera: lo spostemo in su de quel che serve.
      (() => {
        const cv = document.getElementById("nostalgist-canvas");
        const sistema = () => {
          const vert = document.body.classList.contains("touch") && innerHeight > innerWidth;
          const alto = Math.round((innerWidth * 3) / 4);
          if (vert) {
            const su = Math.round((innerHeight - alto) / 2);
            cv.style.transform = "translateY(" + -su + "px)";
            document.documentElement.style.setProperty("--alto-zogo", alto + "px");
          } else {
            cv.style.transform = "";
          }
        };
        addEventListener("resize", sistema);
        addEventListener("orientationchange", () => setTimeout(sistema, 300));
        setInterval(sistema, 1000);
        sistema();
      })();
    </script>
    <script>
      // Animazion de la schermata d'avvio, disegnada a pixel (320x180):
      // el Delfin Verde traversa el golfo da Trieste a Muia, coi Wingull.
      (() => {
        const cv = document.getElementById("splash");
        if (!cv || !cv.getContext) return;
        const g = cv.getContext("2d");
        const W = 320, H = 180, MAR = 112;
        const resize = () => {
          // tien le proporzioni 16:9 e copri tuto lo schermo
          const r = Math.max(innerWidth / W, innerHeight / H);
          cv.style.width = W * r + "px";
          cv.style.height = H * r + "px";
          cv.style.left = (innerWidth - W * r) / 2 + "px";
          cv.style.top = (innerHeight - H * r) / 2 + "px";
        };
        addEventListener("resize", resize);
        resize();
        const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); };
        // stele e nuvole fisse
        const stele = Array.from({ length: 40 }, (_, i) => [(i * 73) % W, (i * 37) % 60, i % 3]);
        const nuvole = [[30, 30, 46], [150, 18, 60], [250, 40, 40]];
        const case_ = [];
        for (let i = 0; i < 16; i++) case_.push([190 + i * 8 + (i % 3), 10 + ((i * 7) % 12)]);
        let t0 = performance.now();
        const frame = (now) => {
          if (cv.classList.contains("via") && getComputedStyle(cv).opacity === "0") return;
          const t = (now - t0) / 1000;
          // cielo all'alba
          const cieli = ["#16325c", "#2a4f86", "#4f74a8", "#8a8fb4", "#e7a37c", "#f6c47a"];
          cieli.forEach((c, i) => R(0, i * 19, W, 20, c));
          stele.forEach(([x, y, k]) => { if ((t * 2 + k) % 3 > 0.6 && y < 40) R(x, y, 1, 1, "#ffffffaa"); });
          // sol che leva
          g.fillStyle = "#ffd36b"; g.beginPath(); g.arc(140, MAR - 2, 20, 0, Math.PI * 2); g.fill();
          R(118, MAR - 6, 44, 2, "#f6c47a"); R(122, MAR - 12, 36, 2, "#f6c47a");
          // nuvole
          nuvole.forEach(([x, y, w], i) => {
            const nx = ((x + t * (4 + i)) % (W + 80)) - 60;
            R(nx, y, w, 6, "#ffffff55"); R(nx + 8, y - 4, w - 16, 4, "#ffffff44");
          });
          // Trieste in lontananza (sinistra)
          for (let i = 0; i < 9; i++) R(4 + i * 9, MAR - 10 - ((i * 5) % 9), 7, 10 + ((i * 5) % 9), "#3b4f73");
          R(0, MAR - 3, 92, 3, "#3b4f73");
          // Muia (destra): colina, case, Duomo e Castel
          g.fillStyle = "#2f5a3a";
          g.beginPath(); g.moveTo(170, MAR); g.quadraticCurveTo(250, MAR - 70, 330, MAR - 40); g.lineTo(330, MAR); g.fill();
          R(282, MAR - 66, 22, 16, "#b9a98a"); R(282, MAR - 70, 4, 4, "#b9a98a"); R(291, MAR - 70, 4, 4, "#b9a98a"); R(300, MAR - 70, 4, 4, "#b9a98a");
          R(290, MAR - 60, 5, 7, "#5a4a3a");
          case_.forEach(([x, h], i) => {
            R(x, MAR - h - 6, 7, h + 6, i % 2 ? "#e8d8b8" : "#f2c9a0");
            R(x - 1, MAR - h - 8, 9, 3, "#c4553a");
            if ((i + (t | 0)) % 5 === 0) R(x + 2, MAR - h - 2, 2, 2, "#ffe98a");
          });
          R(236, MAR - 40, 8, 34, "#d9c7a5"); R(235, MAR - 44, 10, 4, "#c4553a"); R(238, MAR - 34, 4, 5, "#5a4a3a");
          // mar
          R(0, MAR, W, H - MAR, "#2a6db5");
          for (let y = MAR + 4; y < H; y += 7) {
            const off = (t * (12 + (y - MAR) / 4)) % 24;
            for (let x = -24; x < W; x += 24) R(x + off + ((y / 7) % 2) * 12, y, 8, 1, "#6fb0e8");
          }
          // riflesso del sol
          for (let y = MAR + 2; y < MAR + 30; y += 4) R(126 + Math.sin(t * 3 + y) * 3, y, 28 - (y - MAR) / 2, 1, "#ffe0a0aa");
          // el Delfin Verde (catamaran bianco e verde) che va verso Muia
          const giro = 22;
          const p = (t % giro) / giro;
          const bx = -60 + p * 300;
          const by = MAR + 22 + Math.sin(t * 2.2) * 1.5;
          R(bx, by + 8, 44, 3, "#0d3e75");
          R(bx, by, 44, 8, "#ffffff"); R(bx + 4, by - 6, 30, 6, "#ffffff");
          R(bx, by + 4, 44, 2, "#2e9d4a"); R(bx + 6, by - 4, 24, 2, "#1d2f45");
          R(bx + 36, by - 10, 3, 4, "#2e9d4a");
          // scia
          for (let i = 1; i < 6; i++) R(bx - i * 9, by + 9 + (i % 2), 7, 1, "#cfe8ff");
          // Wingull in volo
          for (let k = 0; k < 3; k++) {
            const wx = ((t * (18 + k * 6) + k * 110) % (W + 40)) - 20;
            const wy = 40 + k * 14 + Math.sin(t * 3 + k) * 4;
            const su = Math.sin(t * 10 + k) > 0;
            R(wx, wy, 6, 2, "#ffffff");
            R(wx - 4, wy + (su ? -2 : 1), 4, 1, "#ffffff"); R(wx + 6, wy + (su ? -2 : 1), 4, 1, "#ffffff");
            R(wx + 5, wy, 2, 1, "#f2b84b");
          }
          requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
        // frasi che cambia sotto el titolo
        const frasi = [
          "El Delfin Verde porta un foresto a Muia…",
          "Oto bolli del Carneval, i Super 4 e el sindaco Pochibori…",
          "…e Tubo, che te ferma a ogni canton.",
          "Daghe, mulo: Trieste te speta!"
        ];
        let n = 0;
        const cap = document.getElementById("splash-caption");
        setInterval(() => { if (cap) { n = (n + 1) % frasi.length; cap.textContent = frasi[n]; } }, 4000);
      })();
    </script>
    <!-- Sfondo animado (web/gioca/sfondi): se no el se carica, resta la schermata a pixel de sora -->
    <script src="sfondi/muia-sfondi.js"></script>
    <script>
      (() => {
        const box = document.getElementById("sfondi");
        if (!box || !window.MuiaSfondi) return;
        MuiaSfondi.avvia(box, { base: "sfondi/", scena: 4 })
          .then((sf) => {
            window.muiaSfondo = sf;
            if (typeof window.muiaProgresso === "number") sf.progresso(window.muiaProgresso);
            // quando el sfondo xe pronto, la schermata a pixel soto se pol fermar
            setTimeout(() => {
              const vecia = document.getElementById("splash");
              if (vecia && !box.classList.contains("via")) vecia.classList.add("via");
            }, 900);
            new MutationObserver(() => {
              if (box.classList.contains("via")) setTimeout(() => sf.ferma(), 900);
            }).observe(box, { attributes: true, attributeFilter: ["class"] });
          })
          .catch(() => {});
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
